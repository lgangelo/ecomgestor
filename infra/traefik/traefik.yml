# Configuração estática do Traefik.
#
# Topologia atual: Cloudflare Tunnel (cloudflared) roda na VM e conecta de SAÍDA para a borda da
# Cloudflare — não há porta pública exposta na VM. SSL/TLS da Cloudflare está em modo "Full
# (strict)": a borda da Cloudflare termina o HTTPS do navegador, mas exige HTTPS válido também
# entre o túnel e este Traefik. Por isso o túnel encaminha para `https://localhost:443`
# (entrypoint `websecure`) e este Traefik apresenta um certificado de origem da Cloudflare
# (Origin CA), configurado como certificado estático em infra/traefik/dynamic/tls.yml — os
# roteadores em docker-compose.yml usam `entrypoints=websecure` + `tls=true`, sem
# `tls.certresolver` (não é ACME/Let's Encrypt, é um arquivo estático).
#
# `certificatesResolvers.letsencrypt` fica definido mas sem nenhum roteador o referenciando —
# preservado para o caso de um dia trocar para exposição direta (sem Cloudflare) com desafio
# HTTP-01/DNS-01; não faz nada sozinho.

log:
  level: INFO

entryPoints:
  web:
    address: ':80'
  websecure:
    address: ':443'

providers:
  docker:
    exposedByDefault: false
    network: ecommerce-network
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: 'ops@example.com'
      storage: '/letsencrypt/acme.json'
      httpChallenge:
        entryPoint: web

api:
  dashboard: false
  insecure: false
