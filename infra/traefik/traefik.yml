# Configuração estática do Traefik.
#
# Topologia atual: Cloudflare Tunnel (cloudflared) roda na VM e conecta de SAÍDA para a borda da
# Cloudflare — não há porta pública exposta na VM, e a Cloudflare termina o HTTPS. O túnel
# encaminha para este Traefik via HTTP puro (entrypoint `web`, porta 80); por isso NÃO há
# redirect automático para HTTPS aqui (isso já acontece na borda da Cloudflare, antes de chegar
# na VM) e os roteadores em docker-compose.yml usam `entrypoints=web`, sem `tls.certresolver`.
#
# `websecure`/certificatesResolvers ficam definidos mas sem nenhum roteador os referenciando —
# preservados para o caso de um dia trocar para exposição direta (sem Cloudflare) ou desafio
# DNS-01; não fazem nada sozinhos.

log:
  level: INFO

entryPoints:
  web:
    address: ':80'
  websecure:
    address: ':443'

providers:
  docker:
    exposedByDefault: false
    network: ecommerce-network
  file:
    directory: '/etc/traefik/dynamic'
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: 'ops@example.com'
      storage: '/letsencrypt/acme.json'
      httpChallenge:
        entryPoint: web

api:
  dashboard: false
  insecure: false
