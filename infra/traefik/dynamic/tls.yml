# Certificado de origem (Cloudflare Origin CA) — só a Cloudflare confia nele; nunca é visto
# pelo navegador do usuário final (essa conexão é entre o Cloudflare Tunnel e este Traefik).
# Gerado uma vez em SSL/TLS > Certificados de origem no dashboard da Cloudflare (ver README.md,
# seção de deploy) — os arquivos ficam em infra/traefik/certs/ (fora do git, ver .gitignore).
tls:
  certificates:
    - certFile: /etc/traefik/certs/origin.pem
      keyFile: /etc/traefik/certs/origin.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/origin.pem
        keyFile: /etc/traefik/certs/origin.key
